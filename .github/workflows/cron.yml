name: Scheduled jobs

# Netlify has no built-in cron feature (unlike Vercel's vercel.json crons,
# kept for a future Vercel deploy but inert on Netlify), so these hit the
# same CRON_SECRET-protected routes over HTTP instead -- host-agnostic.
on:
  schedule:
    - cron: "0 6 * * *" # Gmail scan, 06:00 UTC daily
    - cron: "0 8 * * *" # Reminders, 08:00 UTC daily
  workflow_dispatch: {}

jobs:
  gmail-scan:
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Gmail scan
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/gmail-scan" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  reminders:
    if: github.event.schedule == '0 8 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder digest
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
